services:
  - type: web
    name: agrisentry
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 20
      - key: HF_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
